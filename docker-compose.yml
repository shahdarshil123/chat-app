services:
  # ------------------------
  # PostgreSQL Database
  # ------------------------
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
      POSTGRES_DB: chat_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------
  # Prisma Migration Service (one-time)
  # ------------------------
  migrate:
    container_name: chat_migrate
    build:
      context: ./server
    command: npx prisma migrate deploy
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ------------------------
  # Backend Server
  # ------------------------
  server:
    container_name: chat_server
    build:
      context: ./server
    ports:
      - "4000:4000"
      - "5555:5555"
    env_file:
      - ./server/.env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ------------------------
  # Frontend Client
  # ------------------------
  client:
    container_name: chat_client
    build:
      context: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata: